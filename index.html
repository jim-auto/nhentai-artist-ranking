<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artist Atlas — nhentai metadata ranking</title>
  <meta name="description" content="nhentai公開メタデータにおけるartistタグの掲載規模ランキング">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">METADATA ATLAS / 2026</p>
      <h1>Artist <span>Atlas</span></h1>
      <p class="lead">nhentai由来の公開メタデータを、作品数と更新量から静かに読み解く。</p>
      <p class="notice">このページは成人向けサイト由来のメタデータを扱います。画像・本文は表示しません。</p>
    </header>
    <section class="controls" aria-label="ランキング操作">
      <label>検索 <input id="search" type="search" placeholder="artist名で絞り込み"></label>
      <label>並び順 <select id="sort"><option value="galleries">作品数</option><option value="recent">直近12か月</option><option value="pages">総ページ数</option><option value="score">指数</option></select></label>
    </section>
    <section class="summary" id="summary"></section>
    <section class="table-wrap"><table><thead><tr><th>#</th><th>Artist</th><th>作品数</th><th>総ページ数</th><th>直近12か月</th><th>指数</th></tr></thead><tbody id="table"></tbody></table></section>
    <footer><p>集計方法: artistタグ付きギャラリー数を主指標に、ページ数・直近12か月の掲載数を補助表示。</p><p>出典: <a href="https://github.com/van-geaux/unofficial-nhentai-api">非公式メタデータスナップショット</a> · <a href="https://nhentai.net">nhentai.net</a></p></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
