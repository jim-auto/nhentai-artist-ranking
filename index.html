<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artist & Character Atlas — nhentai favorites ranking</title>
  <meta name="description" content="nhentai APIのnum_favoritesを集計したartist・characterランキング">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">METADATA ATLAS / 2026</p>
      <h1>Artist <span>Atlas</span></h1>
      <p class="lead">作品ごとの favorites をartist・character単位に集計し、支持の厚みと主要タグを読み解く。</p>
      <p class="notice">このページは成人向けサイト由来のメタデータを扱います。画像・本文は表示しません。</p>
    </header>
    <section class="entity-tabs" aria-label="ランキング種別"><button class="active" data-entity="artists">Artists</button><button data-entity="characters">Characters</button></section>
    <section class="controls" aria-label="ランキング操作">
      <label>検索 <input id="search" type="search" placeholder="artist名で絞り込み"></label>
      <label>並び順 <select id="sort"><option value="favorites">favorites合計</option><option value="median_favorites">favorites中央値</option><option value="top_favorites">最多作品</option><option value="galleries">作品数</option></select></label>
    </section>
    <section class="summary" id="summary"></section>
    <section class="table-wrap"><table><thead><tr><th>#</th><th id="name-heading">Artist</th><th>favorites合計</th><th>中央値</th><th>最多作品</th><th>作品数</th><th>主要Tags</th></tr></thead><tbody id="table"></tbody></table></section>
    <footer><p>集計方法: 各タグ種別の掲載数上位100組について、人気順上位25作品の num_favorites を合計。主要Tagsは同じ作品群で頻出する一般タグです。</p><p>出典: <a href="https://nhentai.net/api/v2">nhentai API v2</a> · <a href="https://nhentai.net">nhentai.net</a></p></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
